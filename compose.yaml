services:
  app:
    build: .
    image: opensource-explorer:phase5
    ports:
      - '127.0.0.1:${APP_PORT:-8080}:3001'
    environment:
      NODE_ENV: production
      PORT: '3001'
      GITHUB_TIMEOUT_MS: '5000'
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 100
    mem_limit: 256m
    cpus: 1.0
    stop_grace_period: 12s
